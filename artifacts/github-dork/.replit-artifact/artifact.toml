kind = "web"
previewPath = "/"
title = "GitHub Dork Search"
version = "1.0.0"
id = "artifacts/github-dork"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21116

[services.development]
run = "pnpm --filter @workspace/github-dork run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/github-dork", "run", "build" ]
publicDir = "artifacts/github-dork/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21116"
BASE_PATH = "/"
